{% extends 'base.html' %}

{% block title %}Eliminar propiedad{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-body text-center">
            <h3 class="h5 mb-3">¿Eliminar "{{ property.title }}"?</h3>
            <p class="text-muted">Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'properties:my_properties' %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
