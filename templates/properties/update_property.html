{% extends 'base.html' %}

{% block title %}Editar propiedad{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="h2 mb-4">Editar {{ property.title }}</h1>
    <div class="row">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <hr>
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="{% url 'properties:my_properties' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
